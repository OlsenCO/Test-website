<style>
/* Layout: marketplace shell — sticky top bar, centered 1100px column, two-column profile with sticky booking card */
:root {
  --bg: #f7f8f6;
  --surface: #ffffff;
  --fg: #16201e;
  --muted: #5f6d69;
  --line: #e2e7e5;
  --accent: #0f766e;
  --accent-ink: #ffffff;
  --accent-soft: #d8f3ee;
  --star: #d48806;
  --good-bg: #e3f6ec; --good-fg: #146c3c;
  --warn-bg: #fdf2dc; --warn-fg: #7a4e00;
  --bad-fg: #b42318;
  --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1413; --surface: #161e1c; --fg: #eef3f1; --muted: #9aaaa5; --line: #26312e;
    --accent: #3fd1bd; --accent-ink: #052a25; --accent-soft: #123a35; --star: #f0b43c;
    --good-bg: #133524; --good-fg: #8be0b0; --warn-bg: #3a2c0c; --warn-fg: #f3cf85; --bad-fg: #ff8a7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #161e1c; --fg: #eef3f1; --muted: #9aaaa5; --line: #26312e;
  --accent: #3fd1bd; --accent-ink: #052a25; --accent-soft: #123a35; --star: #f0b43c;
  --good-bg: #133524; --good-fg: #8be0b0; --warn-bg: #3a2c0c; --warn-fg: #f3cf85; --bad-fg: #ff8a7a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.demo-bar { background: var(--warn-bg); color: var(--warn-fg); font-size: 13px; }
.demo-bar .wrap { padding-block: 8px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.demo-bar button { background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; color: inherit; font-size: 13px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 17px; text-decoration: none; }
.brand .mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); font-size: 12px; }
.nav-link { color: var(--muted); text-decoration: none; font-size: 14px; }
.nav-link:hover, .nav-link.on { color: var(--fg); }
.spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9px; padding: 9px 16px; font-size: 14px; font-weight: 500; border: 1px solid transparent; cursor: pointer; text-decoration: none; transition: opacity .15s, border-color .15s; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { opacity: .9; }
.btn-secondary { background: var(--surface); border-color: var(--line); }
.btn-secondary:hover { border-color: var(--accent); }
.btn-danger { background: transparent; border-color: var(--line); color: var(--bad-fg); }
.btn-lg { padding: 12px 22px; font-size: 15px; }
.btn-block { width: 100%; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 500; background: var(--surface); cursor: pointer; text-decoration: none; color: var(--muted); }
.chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 12px; font-size: 14px; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
label.lbl { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }

main { padding-block: 32px 64px; }
section + section { margin-top: 48px; }

/* Home */
.hero { padding-block: 40px 8px; display: grid; gap: 20px; }
.hero h1 { font-size: clamp(34px, 6vw, 60px); max-width: 15ch; font-weight: 700; }
.hero p.lede { font-size: 18px; color: var(--muted); max-width: 58ch; }
.hero .actions { display: flex; gap: 12px; flex-wrap: wrap; }
.pill { justify-self: start; background: var(--accent-soft); color: var(--accent); border-radius: 999px; font-size: 13px; font-weight: 500; padding: 5px 12px; }
.grid3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.niche { padding: 18px 20px; text-decoration: none; display: grid; gap: 4px; }
.niche:hover, .mcard:hover { border-color: var(--accent); }
.niche b { font-family: var(--display); font-size: 17px; }
.steps { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.steps .card { padding: 20px; display: grid; gap: 6px; }
.steps .n { font-family: var(--display); color: var(--accent); font-weight: 700; }
.section-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 14px; gap: 12px; }
.section-head a { color: var(--accent); font-size: 14px; text-decoration: none; }

/* Mentor card */
.mcard { padding: 20px; display: flex; flex-direction: column; gap: 12px; text-decoration: none; }
.mcard .who { display: flex; gap: 12px; align-items: center; min-width: 0; }
.mcard .who div { min-width: 0; }
.mcard .name { font-weight: 600; }
.mcard .co { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcard .head { font-size: 14px; }
.mcard .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 4px; font-size: 14px; }
.avatar { flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: 700; }
.stars { color: var(--star); letter-spacing: 1px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags .chip { cursor: default; }

/* Directory */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.toolbar .input { max-width: 380px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

/* Profile */
.profile { display: grid; gap: 40px; grid-template-columns: minmax(0, 1fr) 400px; align-items: start; }
.profile > * { min-width: 0; }
.ptop { display: flex; gap: 18px; align-items: center; }
.ptop h1 { font-size: 34px; }
.headline { font-size: 20px; margin-top: 22px; }
.bio { margin-top: 18px; white-space: pre-line; max-width: 65ch; }
.sess { padding: 16px; display: grid; gap: 4px; }
.sess .row { display: flex; justify-content: space-between; gap: 12px; font-weight: 500; }
.review { padding-block: 14px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.book { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); padding: 20px; display: grid; gap: 14px; }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 14px; cursor: pointer; }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin: 0 8px 0 0; accent-color: var(--accent); }
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.day { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 11px; font-size: 12px; font-weight: 500; cursor: pointer; }
.day.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 4px; font-size: 14px; cursor: pointer; font-variant-numeric: tabular-nums; }
.slot:hover, .day:hover:not(.on) { border-color: var(--accent); }
.slot.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.bookform { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.err { color: var(--bad-fg); font-size: 13px; }

/* Checkout */
.narrow { max-width: 460px; margin: 0 auto; display: grid; gap: 16px; }
.notice { border-radius: 12px; padding: 12px 16px; font-size: 14px; }
.notice.warn { background: var(--warn-bg); color: var(--warn-fg); }
.notice.good { background: var(--good-bg); color: var(--good-fg); }
.split { display: grid; gap: 6px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; font-variant-numeric: tabular-nums; }
.split div { display: flex; justify-content: space-between; }
.cardrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Booking */
dl.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px 12px; font-size: 14px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.badge { margin-left: auto; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 500; background: var(--good-bg); color: var(--good-fg); white-space: nowrap; }
.rate { display: flex; flex-wrap: wrap; gap: 8px; }
.rate button { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 10px; color: var(--star); cursor: pointer; }
.rate button.on { border-color: var(--star); background: var(--warn-bg); }

/* Dashboard */
.dash { display: grid; gap: 32px; grid-template-columns: 190px minmax(0, 1fr); align-items: start; }
.side { display: grid; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); }
.side button { text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer; color: var(--muted); }
.side button.on { background: var(--surface); color: var(--fg); font-weight: 500; }
.stats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.stat { padding: 18px; display: grid; gap: 4px; }
.stat .v { font-family: var(--display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.call { padding: 16px; display: grid; gap: 10px; }
.call .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
.note { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 14px; }
.list li:first-child { border-top: 0; }
.live { padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.live code { color: var(--accent); font-size: 13px; overflow-wrap: anywhere; }
.week { display: grid; gap: 0; }
.week .d { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; align-items: center; padding-block: 10px; border-top: 1px solid var(--line); font-size: 14px; }
.week .d:first-child { border-top: 0; }
.win { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 7px; padding: 3px 10px; font-size: 13px; margin-right: 6px; font-variant-numeric: tabular-nums; }
.integ { padding: 18px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; }
.integ > div:first-child { max-width: 52ch; min-width: 0; display: grid; gap: 4px; }
.ok { background: var(--good-bg); color: var(--good-fg); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 500; }

footer { border-top: 1px solid var(--line); padding-block: 28px; text-align: center; font-size: 12px; color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

@media (max-width: 860px) {
  .profile, .dash { grid-template-columns: minmax(0, 1fr); }
  .book, .side { position: static; }
  .side { display: flex; overflow-x: auto; }
  .side button { white-space: nowrap; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>

  { slug: "design-portfolio", name: "Design Portfolio", tagline: "Portfolio critiques from senior product designers." },
];
const MENTORS = [
  { slug: "maya-chen", name: "Maya Chen", co: "Staff Engineer, ex-Meta", niches: ["break-into-tech", "resume-review"],
    headline: "I've hired 60+ engineers. Let's make your resume pass the 6-second scan.",

    hours: [17, 20], days: [1, 2, 3, 4],
    reviews: [[5, "Alex", "Rewrote my bullets the same night and got two callbacks that week."], [5, "Jordan", "Worth every cent. Honest, specific, zero fluff."], [4, "Taylor", "Great advice on positioning. Wish we'd had a bit more time!"], [5, "Sam", "Clear framework for what to do next. Already booked a follow-up."]] },
  { slug: "priya-raman", name: "Priya Raman", co: "Group PM, fintech", niches: ["product-management", "break-into-tech"],
    headline: "From consultant to PM in 9 months. I'll show you the path I took.",
    bio: "I run PM hiring for a 40-person product org and mentor associate PMs. I can help you position non-PM experience and pick the right first PM role.",
    sessions: [{ id: "s3", title: "20-min PM career strategy", min: 20, price: 50, desc: "Positioning, target companies and how to talk about your non-PM experience." }],
    hours: [12, 15], days: [2, 4, 6],
    reviews: [[5, "Morgan", "Gave me a 3-step plan I actually followed. Landed an APM interview."], [5, "Casey", "She knows exactly what hiring managers look for."], [4, "Riley", "Very practical, a little fast-paced."]] },
  { slug: "daniel-okafor", name: "Daniel Okafor", co: "Wharton MBA '24 · Strategy consultant", niches: ["grad-school"],
    headline: "MBA admissions strategy from someone who read applications on the committee.",

    hours: [18, 21], days: [1, 3, 5],
    reviews: [[5, "Jordan", "Changed my whole essay angle. Got into my first choice."], [5, "Alex", "Super direct, which is what I needed."]] },
  { slug: "sam-rivera", name: "Sam Rivera", co: "Principal Product Designer", niches: ["design-portfolio"],
    headline: "Portfolio critique that gets you to the onsite.",

    sessions: [{ id: "s5", title: "20-min portfolio teardown", min: 20, price: 40, desc: "Honest notes on case-study structure and storytelling." }],
    hours: [9, 12], days: [6, 7, 2],
    reviews: [[4, "Taylor", "Tough love, but every point was right."], [5, "Casey", "Restructured two case studies and finally got callbacks."]] },
  { slug: "lena-park", name: "Lena Park", co: "PhD, Stanford · ML Research Scientist", niches: ["grad-school", "break-into-tech"],
    headline: "Deciding on a PhD? Talk to someone who did one and left academia.",
    bio: "I can help with choosing advisors, statements of purpose, and whether a PhD is the right move for an industry research career.",

    hours: [16, 19], days: [2, 3, 5],
    reviews: [[5, "Riley", "Saved me from applying to the wrong programs."]] },
  { slug: "omar-haddad", name: "Omar Haddad", co: "Tech Recruiter, 8 yrs", niches: ["resume-review", "break-into-tech"],
    headline: "I screen 200 resumes a week. Here's what makes me say yes.",
    bio: "Agency and in-house recruiter for engineering and data roles. I'll tell you exactly what a recruiter sees in the first pass.",
    sessions: [{ id: "s7", title: "20-min recruiter screen", min: 20, price: 30, desc: "A mock recruiter screen plus resume feedback." }],
    hours: [10, 13], days: [1, 2, 3, 4, 5],
    reviews: [[4, "Morgan", "Useful insider view on how screening really works."], [5, "Sam", "Fixed my LinkedIn headline on the call."], [5, "Alex", "Fast and direct."]] },
];

const state = { pending: null, booked: [], rated: {}, dashTab: "overview" };
const SEED_CALLS = [
  { mentee: "Jordan Lee", email: "jordan@example.com", session: "20-min resume review", price: 45, offsetDays: 1, hour: 18, notes: "Teacher moving into software engineering. Resume attached." },
  { mentee: "Priya S.", email: "priya.s@example.com", session: "Mock behavioral interview", price: 60, offsetDays: 3, hour: 19, notes: "Onsite at a fintech next week. Want to tighten my conflict story." },
];
const PAST = [["Alex Demo", "20-min resume review", 5, 9], ["Taylor Demo", "20-min resume review", 4, 16], ["Sam Demo", "Mock behavioral interview", 5, 23], ["Morgan Demo", "20-min resume review", 0, 30]];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (n) => "$" + (Number.isInteger(n) ? n : n.toFixed(2));
const initials = (n) => n.split(/\s+/).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
const avatar = (n, size = 48) => `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.36)}px" aria-hidden="true">${initials(n)}</div>`;
const tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "your timezone"; } catch { return "your timezone"; } })();
const rating = (m) => { const r = m.reviews; return r.reduce((a, x) => a + x[0], 0) / r.length; };
const starStr = (n) => "★".repeat(n) + "☆".repeat(5 - n);
const fmtDay = (d) => d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const fmtTime = (d) => d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
const fmtFull = (d) => d.toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600);
}

function mentorCard(m) {
  const nn = m.niches.map((s) => NICHES.find((n) => n.slug === s).name);
  const from = Math.min(...m.sessions.map((s) => s.price));
  return `<a class="card mcard" href="#m-${m.slug}">
    <div class="who">${avatar(m.name)}<div><div class="name">${esc(m.name)}</div><div class="co">${esc(m.co)}</div></div></div>
    <p class="head">${esc(m.headline)}</p>
    <div class="tags">${nn.map((n) => `<span class="chip">${n}</span>`).join("")}</div>
    <div class="foot"><span><span class="stars">★</span> <b>${rating(m).toFixed(1)}</b> <span class="muted">(${m.reviews.length})</span></span><span>from <b>${money(from)}</b></span></div>
  </a>`;
}

function slotsFor(m, minutes) {
  const out = {}; const now = new Date(); const earliest = new Date(now.getTime() + 12 * 3600e3);
  for (let i = 0; i < 14; i++) {
    const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    const wd = day.getDay() === 0 ? 7 : day.getDay();
    if (!m.days.includes(wd)) continue;
    const list = [];
    for (let t = m.hours[0] * 60; t + minutes <= m.hours[1] * 60; t += 30) {
      const s = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, t);
      if (s < earliest) continue;
      if ((i * 7 + t / 30 + m.slug.length) % 5 === 0) continue; // some slots already taken
      if (state.booked.some((b) => b.mentor === m.slug && b.start.getTime() === s.getTime())) continue;
      list.push(s);
    }
    if (list.length) out[day.toDateString()] = list;
  }
  return out;
}

/* ---------- Router ---------- */
function render() {
  const h = (location.hash || "#home").slice(1);
  let html;
  if (h === "mentors") html = viewMentors();
  else if (h.startsWith("niche-")) html = viewMentors(h.slice(6));
  else if (h.startsWith("m-")) html = viewMentor(h.slice(2));
  else if (h === "checkout") html = viewCheckout();
  else if (h === "booked") html = viewBooked();
  else if (h === "become") html = viewBecome();
  else if (h === "dashboard") html = viewDashboard();
  else html = viewHome();
  $("#view").innerHTML = html;
  document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("on", h === a.dataset.nav || (a.dataset.nav === "mentors" && (h.startsWith("niche-") || h.startsWith("m-")))));
}
function goto(hash) { if (location.hash === "#" + hash) { render(); } else { location.hash = hash; } window.scrollTo(0, 0); }
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-toast]"); if (!t) return;
  if (t.dataset.toast) { toast(t.dataset.toast); return; }
  if (t.dataset.day) { book.day = t.dataset.day; book.slot = null; refreshBook(); return; }
  if (t.dataset.slot) { book.slot = new Date(Number(t.dataset.slot)); refreshBook(); return; }
  if (t.dataset.tab) { state.dashTab = t.dataset.tab; render(); return; }
  if (t.dataset.r) { document.querySelectorAll("#rate button").forEach((b) => b.classList.toggle("on", b === t)); return; }
  if (t.id === "revBtn") { const b = state.booked[state.booked.length - 1]; const r = Number($("#rate .on").dataset.r); state.rated[b.id] = r;
    const m = MENTORS.find((x) => x.slug === b.mentor); m.reviews.unshift([r, b.name.split(" ")[0], $("#revText").value.trim() || "Great call."]); render(); toast("Review posted"); return; }
  if (t.id === "cancelBtn") { const b = state.booked.pop(); toast(`Cancelled. ${money(b.price)} refunded to the card.`); goto("m-" + b.mentor); return; }
  if (t.id === "copyBtn") { navigator.clipboard?.writeText("https://mentorminutes.app/m/maya-chen").then(() => toast("Link copied"), () => toast("mentorminutes.app/m/maya-chen")); return; }
  if (t.id === "resetBtn") { state.pending = null; state.booked = []; state.rated = {}; state.dashTab = "overview"; book.slug = null; viewMentors.q = ""; goto("home"); toast("Demo reset"); }
});
document.addEventListener("change", (e) => { if (e.target.name === "st") { book.sid = e.target.value; book.slot = null; refreshBook(); } });
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "searchForm") { viewMentors.q = $("#q").value.trim(); render(); return; }
  if (f.id === "signupForm") { goto("dashboard"); toast("Account created. This is a sample dashboard."); return; }
  if (f.id === "bookForm") {
    const name = $("#bName").value.trim(), email = $("#bEmail").value.trim();
    const err = $("#bErr");
    if (name.length < 2 || !/^\S+@\S+\.\S+$/.test(email)) { err.textContent = "Enter your name and a valid email so we can send the invite."; err.hidden = false; return; }
    const m = MENTORS.find((x) => x.slug === book.slug); const s = m.sessions.find((x) => x.id === book.sid);
    state.pending = { mentor: m.slug, mentorName: m.name, session: s.title, min: s.min, price: s.price, start: book.slot, name, email, notes: $("#bNotes").value.trim() };
    goto("checkout"); return;
  }
  if (f.id === "payForm") {
    const btn = $("#payBtn"); btn.disabled = true; btn.textContent = "Processing…";
    setTimeout(() => {
      const p = state.pending; state.pending = null;
      const code = Math.random().toString(36).slice(2, 5) + "-" + Math.random().toString(36).slice(2, 6) + "-" + Math.random().toString(36).slice(2, 5);
      state.booked.push({ ...p, id: Date.now(), meet: "meet.google.com/" + code });
      book.slot = null; goto("booked");
    }, 900);
  }
});
function refreshBook() { const m = MENTORS.find((x) => x.slug === book.slug); const c = $("#bookCard"); if (m && c) c.innerHTML = bookCardHtml(m); }

render();
</script>
